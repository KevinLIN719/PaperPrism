<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="stylesheet" href="/buttons.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperPrism · 段落解析预览</title>
<style>
  :root {
    --paper: #faf8f4;
    --ink: #1f1c18;
    --ink-soft: #6b635a;
    --line: #e3ddd2;
    --accent: #a8552a;
    --accent-soft: #fbeee5;
    --mark: #ffe9b8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 22px; border-bottom: 1px solid var(--line);
    background: rgba(250, 248, 244, .92); position: sticky; top: 0; z-index: 5;
    backdrop-filter: blur(6px);
  }
  .logo { font-weight: 700; letter-spacing: .02em; }
  .logo span { color: var(--accent); }
  select, button {
    font: inherit; color: inherit; background: #fff;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  }
  button.primary {
    background: var(--accent); color: #fff; border-color: var(--accent);
    cursor: pointer; font-weight: 600;
  }
  button.primary:disabled { opacity: .5; cursor: default; }
  .meta { margin-left: auto; color: var(--ink-soft); font-size: 13px; }

  main { flex: 1; display: flex; min-height: 0; }

  #reading { flex: 1; overflow-y: auto; padding: 28px 40px 120px; }
  #doc { max-width: 70ch; margin: 0 auto; }
  .paper-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px; line-height: 1.3; margin: 0 0 4px;
  }
  .warn { margin: 10px 0 0; padding: 8px 12px; border-left: 3px solid #c9a227;
    background: #fff9e6; color: #6b5720; font-size: 13px; border-radius: 0 6px 6px 0; }
  .stats { color: var(--ink-soft); font-size: 13px; margin-bottom: 26px; }

  p.para {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px; line-height: 1.72; margin: 0 0 16px;
    padding: 3px 8px; border-radius: 6px; cursor: pointer;
    transition: background .12s;
  }
  p.para:hover { background: #f2ece1; }
  p.para.sel { background: var(--mark); }
  p.para.heading {
    font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    font-size: 17px; font-weight: 700; margin: 30px 0 12px;
  }
  p.para.caption {
    font-size: 14px; line-height: 1.6; color: var(--ink-soft);
    font-style: italic; margin: 8px 0 22px;
  }
  .pmark {
    font-family: ui-monospace, Consolas, monospace; font-size: 11px;
    color: #b3aa9c; margin-right: 6px; user-select: none;
  }

  aside {
    width: 330px; flex: none; border-left: 1px solid var(--line);
    background: #fffdf9; overflow-y: auto; padding: 20px;
  }
  aside h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); margin: 0 0 12px; }
  .kv { font-size: 13px; margin-bottom: 10px; }
  .kv b { display: block; color: var(--ink-soft); font-weight: 500; font-size: 12px; margin-bottom: 3px; }
  code.anchor {
    display: block; font-family: ui-monospace, Consolas, monospace;
    font-size: 11.5px; line-height: 1.6; background: var(--accent-soft);
    border: 1px solid #f0d9c8; border-radius: 6px; padding: 8px; word-break: break-all;
  }
  .empty { color: #b3aa9c; font-size: 13px; line-height: 1.7; }
  .placeholder {
    margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--line);
    color: #b3aa9c; font-size: 13px;
  }
  .placeholder b { color: var(--ink-soft); }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #ddd; border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="logo">Paper<span>Prism</span></div>
  <select id="picker"></select>
  <button class="primary" id="go">解析</button>
  <div class="meta" id="meta"></div>
</header>

<main>
  <div id="reading">
    <div id="doc">
      <p class="empty">选一篇 PDF，点「解析」。<br>这一步只验一件事：段落切得对不对、能不能点中。</p>
    </div>
  </div>

  <aside>
    <h3>选中段落</h3>
    <div id="detail"><p class="empty">先点正文里的任意一段。</p></div>
    <div class="placeholder">
      <b>下一步往这里填</b><br>
      批注（claim / evidence）、术语抽屉、追问输入框。当前是本机后端 + 段落列表，M2 的骨架。
    </div>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
let paras = [];

async function boot() {
  try {
    const r = await fetch('/api/papers');
    const { papers } = await r.json();
    $('picker').innerHTML = papers.map(p =>
      `<option value="${p.path}">${p.name} · ${p.kb} KB</option>`).join('');
    if (!papers.length) $('picker').innerHTML = '<option>papers/ 里没有 PDF</option>';
  } catch (e) {
    $('meta').textContent = '后端没起来？' + e.message;
  }
}

async function parse() {
  const path = $('picker').value;
  $('go').disabled = true;
  $('meta').innerHTML = '<span class="spinner"></span> 解析中…';
  const t0 = performance.now();
  try {
    const r = await fetch('/api/parse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path }),
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    paras = data.paras;
    const ms = Math.round(performance.now() - t0);
    render(data, ms);
  } catch (e) {
    $('meta').textContent = '失败：' + e.message;
  } finally {
    $('go').disabled = false;
  }
}

function render(data, ms) {
  const kinds = { body: 0, heading: 0, caption: 0 };
  paras.forEach(p => kinds[p.kind] = (kinds[p.kind] || 0) + 1);
  $('meta').textContent =
    `${data.count} 段 · ${data.pages} 页 · body ${kinds.body} / heading ${kinds.heading} / caption ${kinds.caption} · ${ms} ms`;

  const longest = Math.max(...paras.map(p => p.text.length));
  const rough = longest > 2000;
  const head = `<h1 class="paper-title">${data.file.replace(/\.pdf$/i, '')}</h1>
    <div class="stats">点任意一段，右栏看它的锚点（段序号 + 首 8 词）。</div>
    ${rough ? `<div class="warn">这篇版式不是 arXiv LaTeX（紧凑多栏 / 表格多）：段会切得更粗，最长一段 ${longest} 字。v1 只承诺 arXiv 版式。</div>` : ''}`;
  const body = paras.map(p => `
    <p class="para ${p.kind}" data-i="${p.i}">
      <span class="pmark">${String(p.i + 1).padStart(2, '0')}</span>${escapeHtml(p.text)}
    </p>`).join('');
  $('doc').innerHTML = head + body;
  $('doc').querySelectorAll('p.para').forEach(el =>
    el.addEventListener('click', () => select(+el.dataset.i, el)));
  $('reading').scrollTop = 0;
  $('detail').innerHTML = '<p class="empty">先点正文里的任意一段。</p>';
}

function select(i, el) {
  document.querySelectorAll('p.para.sel').forEach(e => e.classList.remove('sel'));
  el.classList.add('sel');
  const p = paras[i];
  $('detail').innerHTML = `
    <div class="kv"><b>类型 / 位置</b>${p.kind} · 第 ${p.page} 页 · ${p.col} · ${p.chars} 字符</div>
    <div class="kv"><b>锚点（批注就挂在这个上面）</b>
      <code class="anchor">${escapeHtml(JSON.stringify(p.anchor, null, 1))}</code>
    </div>
    <div class="kv"><b>正文</b></div>
    <div style="font-family:Georgia,serif;font-size:14px;line-height:1.65;color:#4a443c">
      ${escapeHtml(p.text)}
    </div>`;
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

$('go').addEventListener('click', parse);
boot();
</script>
</body>
</html>
